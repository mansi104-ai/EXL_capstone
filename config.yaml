# Vulnerable Customer Care Agent — runtime configuration

# Four regulator-defined vulnerability drivers (FCA-aligned).
drivers:
  - health
  - life_events
  - resilience
  - capability

classifier:
  # Base transformer to fine-tune. Small + CPU-friendly.
  base_model: distilbert-base-uncased
  model_dir: artifacts/classifier
  max_length: 128
  # Per-driver probability above which an indicator is flagged.
  threshold: 0.5
  # Multi-label: an utterance can trip several drivers at once.
  multi_label: true

rag:
  policy_path: data/policy/vulnerability_policy.md
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  index_dir: artifacts/policy_index
  top_k: 3

evidence:
  # Append-only, hash-chained JSONL evidence log.
  path: artifacts/evidence/evidence_log.jsonl

ingestion:
  # "auto" -> Azure if configured and not forced simulated, else simulated.
  mode: auto
  simulated_delay_seconds: 0.0
